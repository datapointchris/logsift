name: Cross-platform

# Only what validate.yml cannot express. The generated workflow runs one job
# per component on ubuntu-latest, so the baseline — ruff, mypy, pytest, bandit —
# lives there and is not repeated here. What is left is the platform coverage a
# single-runner job cannot give: logsift drives a tty, shells out to fzf, and
# picks a notification backend per platform, so the same suite genuinely can
# pass on Linux and fail on macOS.
#
# ubuntu-24.04 is deliberately absent: it is what ubuntu-latest resolves to, so
# a leg for it would re-run exactly what validate.yml already ran.

on:
  pull_request:
    branches: [main, master, develop]
  workflow_call:
  workflow_dispatch:

env:
  ENVIRONMENT: "testing"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run pytest with coverage
        run: uv run pytest --cov=logsift --cov-report=xml --cov-report=term

      # One upload, from the Linux leg. The condition used to name
      # ubuntu-24.04 and Python 3.12 — neither of which the matrix contained,
      # and 3.12 is below the project's requires-python floor — so this step
      # was skipped on every run since it was written.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-22.04'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Minimize uv cache
        run: uv cache prune --ci

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check build artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
