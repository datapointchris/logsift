name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

jobs:
  # Without this, release published whatever was on main, tested or not — a
  # commit that failed lint still cut a version on 2026-07-27.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
