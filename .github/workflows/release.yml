name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release published whatever was on main, tested or not — a
  # commit that failed lint still cut a version on 2026-07-27.
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    uses: datapointchris/reusable-workflows/.github/workflows/python-semantic-release.yml@v1
    permissions:
      contents: write
