[project]
name = "logsift"
version = "0.1.4"
description = "Intelligent log analysis and command monitoring tool designed for LLM-driven automated workflows"
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # CLI and UI
    "typer>=0.15.0",
    # Used directly for Context/HelpFormatter and colour-preserving echo.
    # Typer dropped its own click dependency in 0.27, so declare it explicitly.
    "click>=8.0.0",
    # TOML handling
    "tomli-w>=1.0.0",
    # Process handling
    "sh>=2.0.0",
    # Date parsing
    "python-dateutil>=2.8.0",
    "toon-format",
    # Self-update and the daily update notice
    "pyselfupdate[typer]>=0.2.2",
]
keywords = ["log-analysis", "monitoring", "llm", "automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/datapointchris/logsift"
Documentation = "https://github.com/datapointchris/logsift"
Repository = "https://github.com/datapointchris/logsift"
Issues = "https://github.com/datapointchris/logsift/issues"

[project.scripts]
logsift = "logsift.cli:app"

[dependency-groups]
dev = [
    # Development tools and linting
    "bandit>=1.7.8",
    "coverage>=7.5.0",
    "deptry>=0.16.1",
    "docformatter>=1.7.5",
    "interrogate>=1.7.0",
    "mypy>=1.10.0",
    "ruff>=0.7.0",
    # Documentation
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-material>=9.5.20",
    "mkdocstrings-python>=1.16.10",
    "mkdocstrings>=0.29.1",
    "pymdown-extensions>=10.8.1",
    # Type stubs for development
    "types-python-dateutil>=2.8.0",
    # Additional dev dependencies
    "pre-commit>=4.3.0",
]
test = [
    # Testing framework and tools
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "pytest-md>=0.2.0",
    "pytest-mock>=3.12",
    # Test data generation and mocking
    "Faker>=25.0.1",
    "freezegun>=1.5.1",
    "pytest>=8.4.1",
]


# ---------- Tool Configurations ---------- #


[tool.bandit]
exclude_dirs = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "tests"]
skips = ["B113", "B311"]


[tool.codespell]
skip = '*.css.map'
ignore-words-list = "astroid,aNULL,ANULL,anull"
check-filenames = true
check-hidden = true
builtin = "clear,rare"
uri-ignore-words-list = "*"


[tool.coverage.run]
parallel = true
branch = true
source = ["logsift"]
omit = []

[tool.coverage.paths]
source = ["src/logsift"]

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]


[tool.docformatter]
recursive = true
in-place = true
exclude = [".git", ".mypy_cache", ".venv", "build", "dist"]
wrap-summaries = 140
wrap-descriptions = 140
close-quotes-on-newline = true
blank = false


[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
# Same tree ruff already excludes below. These files carry deliberate type
# errors so the pattern tests have real mypy output to match against; CI runs
# `mypy .` over the whole repo, which no pre-commit exclude reaches.
exclude = ['^tests/fixtures/pre-commit-violations/']

# `standard` replaces the per-rule opt-outs repos used to accumulate; basedpyright
# defaults to `recommended`, which turns every one of them back on. Named
# `pyright` so both basedpyright and Pylance read it.

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
verbosity_assertions = 2


[tool.refurb]
ignore = [
    "FURB184",  # Allow separate assignment and assertion in tests for readability
]


[tool.ruff]
line-length = 140
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".vscode",
    ".venv",
    "build",
    "dist",
    # Fixtures that intentionally contain lint violations for testing pattern detection
    "tests/fixtures/pre-commit-violations",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.forge]
# Keys the shared toolchain standard owns, written by its generator.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["codespell", "check-hidden"],
    ["codespell", "builtin"],
    ["codespell", "uri-ignore-words-list"],
    ["pytest", "ini_options", "verbosity_assertions"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "logsift"
module-root = "src"

[tool.uv.sources]
toon-format = { git = "https://github.com/toon-format/toon-python" }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
# The package name is hardcoded on purpose. python-semantic-release sets no
# $PACKAGE_NAME, so `uv lock --upgrade-package "$PACKAGE_NAME"` silently no-ops
# and ships a stale lock file in the release commit.
build_command = """
    pip install uv
    uv lock --upgrade-package logsift
    git add uv.lock
"""
